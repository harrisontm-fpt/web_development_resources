<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Branch and merge</title><desc id="desc">Commits C and D independently follow B. Merge commit M combines C and D.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.tag{font-size:17px;font-weight:700;fill:#334155}.node{font-size:22px;font-weight:700;fill:white;text-anchor:middle}</style>
<rect width="1200" height="440" fill="#f8fafc"/>
<text x="30" y="45" class="title" >Separate changes, one integrated result</text><text x="30" y="78" class="body" >A branch points to a commit. This example combines two histories with a merge commit.</text><path d="M90 175 H1030 M280 175 C350 175 345 300 440 300 H600 C800 300 840 175 1030 175" fill="none" stroke="#475569" stroke-width="4"/><circle cx="90" cy="175" r="24" fill="#475569"/><text x="90" y="183" class="node" >A</text><circle cx="280" cy="175" r="24" fill="#475569"/><text x="280" y="183" class="node" >B</text><circle cx="610" cy="175" r="24" fill="#0369a1"/><text x="610" y="183" class="node" >C</text><circle cx="550" cy="300" r="24" fill="#7c3aed"/><text x="550" y="308" class="node" >D</text><circle cx="1030" cy="175" r="24" fill="#15803d"/><text x="1030" y="183" class="node" >M</text><text x="55" y="130" class="small" >Initial work</text><text x="70" y="240" class="small" >Shared starting point</text><text x="475" y="130" class="small" >Mobile check merged into main</text><text x="410" y="350" class="small" >Keyboard check on feature branch</text><text x="910" y="130" class="small" >Combined checks</text><text x="835" y="255" class="small" >M has parents C and D.</text><text x="835" y="281" class="small" >main advances to M.</text><text x="30" y="407" class="body" >Read both changes before merging. A successful merge still needs review and checking.</text>
</svg>
