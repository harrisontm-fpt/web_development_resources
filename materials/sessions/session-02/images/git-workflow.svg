<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">Git workflow</title><desc id="desc">Selected working-tree content is staged, committed locally, and pushed to a remote repository.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.tag{font-size:17px;font-weight:700;fill:#334155}.node{font-size:22px;font-weight:700;fill:white;text-anchor:middle}</style>
<rect width="1200" height="450" fill="#f8fafc"/>
<text x="30" y="45" class="title" >From an edit to shared history</text><rect x="15" y="78" width="900" height="260" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="7 5"/><text x="35" y="110" class="tag" >ON YOUR COMPUTER</text><text x="950" y="110" class="tag" >SHARED REMOTE</text><rect x="30" y="165" width="240" height="135" rx="14" fill="#dbeafe" stroke="#cbd5e1" stroke-width="2"/><text x="45" y="199" class="heading" >Working tree</text><text x="45" y="235" class="small" >Edit and save files</text><text x="45" y="273" class="small" >git diff</text><path d="M276 223 L324 223" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><text x="266" y="148" class="small" >git add</text><rect x="330" y="165" width="240" height="135" rx="14" fill="#e0e7ff" stroke="#cbd5e1" stroke-width="2"/><text x="345" y="199" class="heading" >Staging area</text><text x="345" y="235" class="small" >Select the next snapshot</text><text x="345" y="273" class="small" >git diff --staged</text><path d="M576 223 L624 223" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><text x="566" y="148" class="small" >git commit</text><rect x="630" y="165" width="240" height="135" rx="14" fill="#dcfce7" stroke="#cbd5e1" stroke-width="2"/><text x="645" y="199" class="heading" >Local repository</text><text x="645" y="235" class="small" >Record a commit</text><text x="645" y="273" class="small" >git log</text><path d="M876 223 L924 223" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><text x="866" y="148" class="small" >git push</text><rect x="930" y="165" width="240" height="135" rx="14" fill="#fef3c7" stroke="#cbd5e1" stroke-width="2"/><text x="945" y="199" class="heading" >Remote repository</text><text x="945" y="235" class="small" >Share your branch</text><text x="945" y="273" class="small" >Peer can fetch it</text><text x="30" y="385" class="body" >Staging captures the current content. Later edits need staging again.</text><text x="30" y="418" class="body" >A local commit is recorded on your computer; pushing shares it with the remote.</text>
</svg>
