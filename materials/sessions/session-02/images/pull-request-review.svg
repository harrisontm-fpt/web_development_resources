<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">Pull request review</title><desc id="desc">An author proposes a change, a reviewer checks it, the author responds, and the reviewed result is integrated. Revisions return for review.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#475569"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.heading{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:17px}.tag{font-size:17px;font-weight:700;fill:#334155}.node{font-size:22px;font-weight:700;fill:white;text-anchor:middle}</style>
<rect width="1200" height="450" fill="#f8fafc"/>
<text x="30" y="45" class="title" >A pull request makes the change reviewable</text><text x="30" y="80" class="body" >Keep the task, diff, discussion, and checking evidence together.</text><rect x="30" y="150" width="240" height="130" rx="14" fill="#dbeafe" stroke="#cbd5e1" stroke-width="2"/><text x="44" y="187" class="heading" >1  Author</text><text x="44" y="226" class="small" >Focused branch</text><text x="44" y="255" class="small" >Inspect, commit, push</text><path d="M276 215 L324 215" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="150" width="240" height="130" rx="14" fill="#e0e7ff" stroke="#cbd5e1" stroke-width="2"/><text x="344" y="187" class="heading" >2  Reviewer</text><text x="344" y="226" class="small" >Read the task and diff</text><text x="344" y="255" class="small" >Check the result</text><path d="M576 215 L624 215" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="630" y="150" width="240" height="130" rx="14" fill="#fef3c7" stroke="#cbd5e1" stroke-width="2"/><text x="644" y="187" class="heading" >3  Author responds</text><text x="644" y="226" class="small" >Explain or revise</text><text x="644" y="255" class="small" >Push to the same branch</text><path d="M876 215 L924 215" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><rect x="930" y="150" width="240" height="130" rx="14" fill="#dcfce7" stroke="#cbd5e1" stroke-width="2"/><text x="944" y="187" class="heading" >4  Integrate</text><text x="944" y="226" class="small" >Review complete</text><text x="944" y="255" class="small" >Merge and verify</text><path d="M750 287 V333 H450 V287" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><text x="448" y="365" class="small" >Recheck revisions before merging.</text><text x="30" y="413" class="body" >Close the task after checking the integrated result and linking the PR as evidence.</text>
</svg>
